<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0618"/>
      <stop offset="0.55" stop-color="#160a2e"/>
      <stop offset="1" stop-color="#03140f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9945FF">
        <animate attributeName="stop-color" values="#9945FF;#14F195;#00C2FF;#9945FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#00C2FF">
        <animate attributeName="stop-color" values="#00C2FF;#9945FF;#14F195;#00C2FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#14F195">
        <animate attributeName="stop-color" values="#14F195;#00C2FF;#9945FF;#14F195" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9945FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14F195" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="190" cy="70" r="230" fill="url(#glowP)">
    <animate attributeName="r" values="210;250;210" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="290" r="240" fill="url(#glowG)">
    <animate attributeName="r" values="250;200;250" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- candles -->
  <g opacity="0.55">
    <g fill="#14F195">
      <rect x="860" y="150" width="14" height="60" rx="2"/><rect x="866" y="135" width="2" height="90"/>
      <rect x="930" y="110" width="14" height="70" rx="2"/><rect x="936" y="95" width="2" height="100"/>
      <rect x="1000" y="70" width="14" height="80" rx="2"/><rect x="1006" y="50" width="2" height="115"/>
      <rect x="1105" y="40" width="14" height="70" rx="2"/><rect x="1111" y="25" width="2" height="100"/>
    </g>
    <g fill="#FF4D8D">
      <rect x="895" y="160" width="14" height="40" rx="2"/><rect x="901" y="150" width="2" height="65"/>
      <rect x="965" y="125" width="14" height="45" rx="2"/><rect x="971" y="112" width="2" height="72"/>
      <rect x="1035" y="90" width="14" height="40" rx="2"/><rect x="1041" y="80" width="2" height="62"/>
      <rect x="1070" y="75" width="14" height="30" rx="2"/><rect x="1076" y="64" width="2" height="55"/>
    </g>
    <polyline points="840,230 900,200 960,175 1020,120 1080,110 1140,60" fill="none" stroke="#00C2FF" stroke-width="3" stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" values="600;0;0" dur="5s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- live badge -->
  <g transform="translate(70,62)">
    <rect width="96" height="32" rx="16" fill="#FF2E4D"/>
    <circle cx="20" cy="16" r="6" fill="#fff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="22" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" letter-spacing="1.5">LIVE</text>
  </g>
  <text x="180" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b9a9e8" letter-spacing="3">STREAM → SIGNAL → ON-CHAIN</text>

  <text x="66" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="url(#title)" letter-spacing="-2">mev-streamer</text>
  <text x="70" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e8e3ff">Видит токен на стриме — покупает его на pump.fun раньше чата.</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">
    <g transform="translate(70,262)"><rect width="150" height="34" rx="8" fill="#9945FF" fill-opacity="0.2" stroke="#9945FF"/><text x="75" y="22" text-anchor="middle" fill="#d6bcff">👁  OCR 118 ms</text></g>
    <g transform="translate(232,262)"><rect width="168" height="34" rx="8" fill="#00C2FF" fill-opacity="0.18" stroke="#00C2FF"/><text x="84" y="22" text-anchor="middle" fill="#a8ecff">🎙  Whisper 398 ms</text></g>
    <g transform="translate(412,262)"><rect width="190" height="34" rx="8" fill="#14F195" fill-opacity="0.16" stroke="#14F195"/><text x="95" y="22" text-anchor="middle" fill="#a9ffd9">⚡ Sender ‖ Jito ‖ RPC</text></g>
    <g transform="translate(614,262)"><rect width="176" height="34" rx="8" fill="#FFB020" fill-opacity="0.16" stroke="#FFB020"/><text x="88" y="22" text-anchor="middle" fill="#ffe0a3">🎯 exact to lamport</text></g>
  </g>
</svg>
